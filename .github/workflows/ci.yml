name: ci

# `cargo xtask ci` (fmt, clippy -D warnings, tests, layer rules, wasm check) on the three
# desktop platforms. Runner images, the Rust toolchain (rust-toolchain.toml) and the actions
# (by commit SHA) are pinned, so a run only changes when this repository does. To update an
# action, look up the release's commit SHA and change it together with the version comment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    name: cargo xtask ci (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain, components and the wasm target come from rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: rustup show

      - name: Install Linux libraries for eframe/winit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: fmt, clippy, tests, layers, wasm
        run: cargo xtask ci
