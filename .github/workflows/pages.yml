name: pages

# The landing page https://nazdravan.github.io/pixelprobe/ (source in site/), with the web build
# of the app at app/. Rebuilt after every successful release run (a release published by the
# workflow token starts no other workflow, so `on: release` would not fire), when the page,
# the changelog, the screenshots or the theme change on main, and by hand. Download links and
# "latest changes" come from the latest published release; with none yet, the page says so.

on:
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - site/**
      - CHANGELOG.md
      - docs/assets/**
      - assets/theme.toml
      - assets/icon.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The wasm-bindgen CLI must match the wasm-bindgen crate in Cargo.lock; a version bump there
  # fails the build here until these two lines are updated.
  WASM_BINDGEN_VERSION: 0.2.130
  WASM_BINDGEN_SHA256: 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Page tests
        run: |
          node --test site/tests/main.test.mjs
          python3 -m unittest discover -s site/tests
      - name: wasm-bindgen CLI
        run: |
          locked="$(awk '/^name = "wasm-bindgen"$/{getline; print}' Cargo.lock | sed 's/version = "\(.*\)"/\1/')"
          if [ "$locked" != "$WASM_BINDGEN_VERSION" ]; then
            echo "::error::Cargo.lock has wasm-bindgen $locked; update WASM_BINDGEN_VERSION and WASM_BINDGEN_SHA256"
            exit 1
          fi
          name="wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/wb.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$name.tar.gz"
          echo "$WASM_BINDGEN_SHA256  $RUNNER_TEMP/wb.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wb.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >>"$GITHUB_PATH"
      - name: Install the Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Web build
        run: cargo xtask web
      # The latest published release (not a draft or pre-release), if there is one.
      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -n "$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[].tagName')" ]; then
            gh release view --json tagName,publishedAt,url,assets >release.json
          fi
      - name: Page
        run: |
          args=(--out _site --web target/web)
          if [ -f release.json ]; then args+=(--release release.json); fi
          python3 site/build.py "${args[@]}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
