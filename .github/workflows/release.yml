name: release

# Push to `main` -> tests. If the version in Cargo.toml is not yet published -> packages for
# every platform and the release "pixelprobe v<version>" (tag v<version>, SHA256SUMS.txt, notes
# from CHANGELOG.md), published only after every file is uploaded. A published release is never
# overwritten. Manual run (workflow_dispatch): packages on any branch as run artifacts, no
# release. The steps are described in docs/releasing.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test run, e.g. 0.2.0-rc.1 (empty: from Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: version
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      # true: build the packages (unpublished version, or a manual run).
      build: ${{ steps.published.outputs.build }}
      # true: publish a release at the end (push to main, unpublished version).
      publish: ${{ steps.published.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: v
        name: Read the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          . packaging/env.sh
          v="${INPUT_VERSION#v}"
          v="${v:-$VERSION}"
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::\"$v\" is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$v"
            echo "prerelease=$pre"
          } >>"$GITHUB_OUTPUT"
          echo "### pixelprobe v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"
      # A published release is never replaced: if the version exists, a normal push to main
      # only runs the tests.
      - id: published
        name: Is the version already published?
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          build=true
          publish=false
          if [ "$EVENT" = push ]; then
            publish=true
            if draft="$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" &&
              [ "$draft" != "true" ]; then
              build=false
              publish=false
              echo "pixelprobe v$VERSION is already published: tests only. New release: packaging/version.sh set <version>." >>"$GITHUB_STEP_SUMMARY"
            elif git diff --name-only HEAD~1 HEAD | grep -q '^\.github/workflows/'; then
              # The workflow token may not tag a commit that changes workflow files (HTTP 403).
              publish=false
              echo "This commit changes .github/workflows: packages are built, the release waits for the next commit that does not." >>"$GITHUB_STEP_SUMMARY"
            fi
          fi
          {
            echo "build=$build"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"
      # The release notes come from CHANGELOG.md: without the version's section, stop before
      # the builds (they would only fail at publishing).
      - name: Check CHANGELOG.md
        if: steps.published.outputs.build == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: packaging/changelog.sh "$VERSION" >/dev/null

  test:
    name: tests
    needs: version
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux libraries for eframe/winit
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask ci

  linux:
    name: Linux x86_64
    needs: [version, test]
    if: needs.version.outputs.build == 'true'
    timeout-minutes: 45
    # The oldest supported Ubuntu, so the binary runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux libraries for eframe/winit
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - name: Apply the test version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/version.sh set "$VERSION"
      - run: packaging/linux/package.sh
      - run: packaging/linux/deb.sh
      - run: packaging/linux/appimage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: [version, test]
    if: needs.version.outputs.build == 'true'
    timeout-minutes: 45
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply the test version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/version.sh set "$VERSION"
      - name: Build and zip
        run: packaging/windows/package.ps1
      - name: WiX Toolset
        run: dotnet tool install --global wix --version 5.0.2
      - name: Installer (.msi)
        run: packaging/windows/msi.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: [version, test]
    if: needs.version.outputs.build == 'true'
    timeout-minutes: 45
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply the test version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/version.sh set "$VERSION"
      - run: packaging/macos/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-universal
          path: dist/release/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, linux, windows, macos]
    if: needs.version.outputs.publish == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/changelog.sh "$VERSION" >notes.md
      - name: Checksums
        working-directory: dist/release
        run: |
          sha256sum -- * >SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Created as a draft, every file uploaded, and only then made public.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          pre=()
          if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
          # A draft left by an earlier failed run is replaced; a published release never is
          # (the version job stops before the builds then).
          if [ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "v$VERSION" --yes
          fi
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
            --title "pixelprobe v$VERSION" --notes-file notes.md --generate-notes "${pre[@]}" \
            dist/release/*
          gh release edit "v$VERSION" --draft=false
          echo "Published: https://github.com/$GH_REPO/releases/tag/v$VERSION" >>"$GITHUB_STEP_SUMMARY"
