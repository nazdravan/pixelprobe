[package]
name = "pixelprobe"
description = "Monitor test utility: display info, motion test, test patterns, pixel refresh"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.pixelprobe]
layer = 7

[dependencies]
pp-ui.workspace = true
eframe.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pp-control.workspace = true
# Same winit as eframe; used only to list the monitors.
winit = { version = "0.30.13", default-features = false }
# Physical size, names and GPUs off macOS come from the monitors' EDIDs.
pp-edid.workspace = true

# Windows: EDIDs and adapter names from the registry (safe API).
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# The icon and file description inside pixelprobe.exe (build.rs, Windows targets only).
[build-dependencies]
winresource = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
# Same web-sys as eframe; only the extra APIs used here.
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Screen", "console"] }

# macOS display names, physical size and current mode (all safe bindings, no `unsafe`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "objc2-core-foundation"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGDirectDisplay", "CGDirectDisplayMetal", "CGDisplayConfiguration", "CGError", "libc", "objc2", "objc2-metal"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[lints]
workspace = true
